services:
  # ----------------------------------------------------
  # MetroFlow AI Backend (FastAPI Web Service)
  # ----------------------------------------------------
  - type: web
    name: metroflow-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: metroflow-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false

databases:
  # ----------------------------------------------------
  # Managed PostgreSQL Database
  # ----------------------------------------------------
  - name: metroflow-postgres
    plan: free
    region: oregon
    databaseName: metroflow
    user: metroflow_user
